<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Reset password | JobFlow</title>
  <link rel="stylesheet" href="globals.css">
  <link rel="stylesheet" href="reset-password.css">
</head>
<body>
  <main class="reset-page">
    <a class="brand" href="login/login.html" aria-label="JobFlow sign in">
      <span class="brand-mark">J</span>
      <span>JobFlow</span>
    </a>

    <section class="reset-panel" aria-labelledby="reset-title">
      <p class="eyebrow">ACCOUNT ACCESS</p>
      <h1 id="reset-title">Reset your password</h1>
      <p class="intro" id="reset-description">Enter your account email and we’ll send you a secure reset link.</p>

      <form id="request-form">
        <label for="email">Email</label>
        <input id="email" name="email" type="email" placeholder="name@example.com" autocomplete="email" required>
        <button type="submit">Send reset link</button>
      </form>

      <div class="success-message" id="success-message" role="status" aria-live="polite" hidden>
        <span class="success-icon" aria-hidden="true">&#10003;</span>
        <div>
          <strong>Request sent successfully</strong>
          <p id="success-detail"></p>
        </div>
      </div>

      <form id="confirm-form" hidden>
        <label for="password">New password</label>
        <input id="password" name="password" type="password" placeholder="At least 8 characters" minlength="8" autocomplete="new-password" required>
        <label for="confirm-password">Confirm new password</label>
        <input id="confirm-password" name="confirm-password" type="password" placeholder="Enter your new password again" minlength="8" autocomplete="new-password" required>
        <button type="submit">Complete</button>
      </form>

      <p class="form-message" id="form-message" role="status" aria-live="polite"></p>
      <a class="back-link" href="login/login.html">Back to sign in</a>
    </section>
  </main>

  <script>
    const resetToken = new URLSearchParams(window.location.search).get('token');
    const requestForm = document.getElementById('request-form');
    const confirmForm = document.getElementById('confirm-form');
    const description = document.getElementById('reset-description');
    const message = document.getElementById('form-message');
    const successMessage = document.getElementById('success-message');
    const successDetail = document.getElementById('success-detail');

    if (resetToken) {
      requestForm.hidden = true;
      confirmForm.hidden = false;
      description.textContent = 'Choose a new password for your account.';
    }

    async function submitResetRequest(event) {
      event.preventDefault();
      message.textContent = '';
      message.classList.remove('is-error');
      successMessage.hidden = true;

      try {
        const response = await fetch('/api/password-reset/request', {
          method: 'POST',
          headers: { 'Content-Type': 'application/json' },
          body: JSON.stringify({ email: document.getElementById('email').value.trim() })
        });
        const result = await response.json();
        if (!response.ok) throw new Error(result.message || 'Unable to send reset email.');
        successDetail.textContent = result.message;
        successMessage.hidden = false;
        requestForm.reset();
      } catch (error) {
        message.textContent = error.message;
        message.classList.add('is-error');
      }
    }

    async function submitNewPassword(event) {
      event.preventDefault();
      message.textContent = '';

      const password = document.getElementById('password').value;
      const confirmPassword = document.getElementById('confirm-password').value;
      if (password !== confirmPassword) {
        message.textContent = 'The passwords do not match.';
        return;
      }

      try {
        const response = await fetch('/api/password-reset/confirm', {
          method: 'POST',
          headers: { 'Content-Type': 'application/json' },
          body: JSON.stringify({ token: resetToken, password })
        });
        const result = await response.json();
        if (!response.ok) throw new Error(result.message || 'Unable to reset password.');
        sessionStorage.setItem('currentUser', JSON.stringify(result.user));
        message.textContent = 'Password updated. Opening My Account...';
        confirmForm.reset();
        confirmForm.hidden = true;
        description.textContent = 'Your password has been updated.';
        window.setTimeout(() => {
          window.location.href = '/my-account/my-account.html';
        }, 700);
      } catch (error) {
        message.textContent = error.message;
      }
    }

    requestForm.addEventListener('submit', submitResetRequest);
    confirmForm.addEventListener('submit', submitNewPassword);
  </script>
</body>
</html>
