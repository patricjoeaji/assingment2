<script>
  let currentUser;
  try {
    currentUser = JSON.parse(sessionStorage.getItem('currentUser') || 'null');
  } catch (e) {
    currentUser = null;
  }
  if (!currentUser || currentUser.role !== 'Owner') {
    if (currentUser && currentUser.role === 'Worker') {
      window.location.href = '/worker-view/worker-view.html';
    } else {
      window.location.href = '/login/login.html';
    }
  }

  function formatDate(dateValue) {
    if (!dateValue) return '';

    const date = new Date(`${dateValue}T00:00:00`);

    return date.toLocaleDateString('en-AU', {
      day: 'numeric',
      month: 'short',
      year: 'numeric'
    });
  }

  function formatTime(timeValue) {
    if (!timeValue) return '';

    const parts = timeValue.split(':');
    const hour = Number(parts[0]);
    const minute = Number(parts[1]);

    const date = new Date();
    date.setHours(hour, minute, 0, 0);

    return date.toLocaleTimeString('en-AU', {
      hour: 'numeric',
      minute: '2-digit'
    });
  }

  function getJobId() {
    const params = new URLSearchParams(window.location.search);
    return params.get('id');
  }

  function viewJobDetails() {
    const jobId = getJobId();

    if (!jobId) {
      alert('Job ID is missing.');
      return;
    }

    window.location.href =
      `/reallocate-worker/reallocate-worker.html?id=${encodeURIComponent(jobId)}`;
  }

  async function loadSentJob() {
    const jobId = getJobId();

    if (!jobId) {
      document.getElementById('offerMessage').textContent =
        'Job information could not be found.';
      return;
    }

    try {
      const response = await fetch(
        `/api/jobs/${encodeURIComponent(jobId)}`
      );

      const job = await response.json();

      if (!response.ok) {
        throw new Error(
          job.message || 'Unable to load job'
        );
      }

      const workerName =
        job.assignedWorker || 'Selected worker';

      document.getElementById('offerMessage').textContent =
        `Your job offer has been sent to ${workerName}.`;

      document.getElementById('jobTitle').textContent =
        job.title || 'Untitled Job';

      document.getElementById('jobSchedule').textContent =
        `${formatDate(job.date)}, ${formatTime(job.startTime)} – ${formatTime(job.endTime)}`;

      document.getElementById('jobLocation').textContent =
        job.location || '';

      document.getElementById('jobStatus').textContent =
        job.status || 'Pending';

      document.getElementById('offeredWorker').textContent =
        workerName;

    } catch (error) {
      console.error('Load sent job error:', error);

      document.getElementById('offerMessage').textContent =
        'Unable to load the job offer.';

      document.getElementById('jobTitle').textContent =
        'Job not found';
    }
  }

  loadSentJob();
</script>
