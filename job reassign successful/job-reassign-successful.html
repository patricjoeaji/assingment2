<script>
  let currentUser;
  try {
    currentUser = JSON.parse(sessionStorage.getItem('currentUser') || 'null');
  } catch (e) {
    currentUser = null;
  }
  if (!currentUser || currentUser.role !== 'Owner') {
    if (currentUser && currentUser.role === 'Worker') {
      window.location.href = '/worker-view/worker-view.html';
    } else {
      window.location.href = '/login/login.html';
    }
  }

  function getJobId() {
    const params = new URLSearchParams(window.location.search);
    return params.get('id');
  }

  function formatDate(dateValue) {
    if (!dateValue) return '';

    const date = dateValue.includes('T')
      ? new Date(dateValue)
      : new Date(`${dateValue}T00:00:00`);

    return date.toLocaleDateString('en-AU', {
      day: 'numeric',
      month: 'short',
      year: 'numeric'
    });
  }

  function formatTime(timeValue) {
    if (!timeValue) return '';

    const parts = timeValue.split(':');
    const hour = Number(parts[0]);
    const minute = Number(parts[1]);

    const date = new Date();
    date.setHours(hour, minute, 0, 0);

    return date.toLocaleTimeString('en-AU', {
      hour: 'numeric',
      minute: '2-digit'
    });
  }

  function viewJobDetails() {
    const jobId = getJobId();

    if (!jobId) {
      alert('Job ID is missing.');
      return;
    }

    window.location.href =
      `/reallocate-worker/reallocate-worker.html?id=${encodeURIComponent(jobId)}`;
  }

  async function loadReassignedJob() {
    const jobId = getJobId();

    if (!jobId) {
      document.getElementById('jobTitle').textContent =
        'Job not found';
      return;
    }

    try {
      const response = await fetch(
        `/api/jobs/${encodeURIComponent(jobId)}`
      );

      const job = await response.json();

      if (!response.ok) {
        throw new Error(
          job.message || 'Unable to load job'
        );
      }

      document.getElementById('jobTitle').textContent =
        job.title || 'Untitled Job';

      const scheduleElement =
        document.getElementById('jobSchedule');

      scheduleElement.replaceChildren(
        document.createTextNode(formatDate(job.date)),
        document.createElement('br'),
        document.createTextNode(
          `${formatTime(job.startTime)} – ${formatTime(job.endTime)}`
        )
      );

      document.getElementById('jobLocation').textContent =
        job.location || '';

      document.getElementById('jobStatus').textContent =
        job.status || 'Pending';

      document.getElementById('newWorkerName').textContent =
        job.assignedWorker || 'No worker assigned';

      document.getElementById('reassignedDate').textContent =
        formatDate(job.updatedAt || new Date().toISOString());

    } catch (error) {
      console.error('Load reassigned job error:', error);

      document.getElementById('jobTitle').textContent =
        'Unable to load job';
    }
  }

  loadReassignedJob();
</script>
