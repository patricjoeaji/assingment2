<script>
  let currentUser;
  try {
    currentUser = JSON.parse(sessionStorage.getItem('currentUser') || 'null');
  } catch (e) {
    currentUser = null;
  }
  if (!currentUser || currentUser.role !== 'Owner') {
    if (currentUser && currentUser.role === 'Worker') {
      window.location.href = '/worker-view/worker-view.html';
    } else {
      window.location.href = '/login/login.html';
    }
  }

  let calendarStart = formatDateKey(new Date());
  const calendarDaysCount = 14;

  let allJobs = [];
  let selectedDate = null;

  function normaliseStatus(status) {
    return String(status || 'Pending').toLowerCase();
  }

  function formatDateKey(date) {
    const year = date.getFullYear();
    const month =
      String(date.getMonth() + 1).padStart(2, '0');
    const day =
      String(date.getDate()).padStart(2, '0');

    return `${year}-${month}-${day}`;
  }

  function createDateFromKey(dateKey) {
    return new Date(`${dateKey}T00:00:00`);
  }

  function formatSelectedDate(dateKey) {
    return createDateFromKey(dateKey)
      .toLocaleDateString('en-AU', {
        weekday: 'long',
        day: 'numeric',
        month: 'long'
      });
  }

  function getJobsForDate(dateKey) {
    return allJobs.filter(job => job.date === dateKey);
  }

  function getDotClass(status) {
    const normalised = normaliseStatus(status);

    if (normalised === 'finished') return 'calendar-dot-finished';

    if (normalised === 'accepted') {
      return 'italic-text-2';
    }

    if (normalised === 'declined') {
      return 'italic-text-3';
    }

    return 'italic-text';
  }

  function renderDateRange() {
    const start = createDateFromKey(calendarStart);
    const end = new Date(start);
    end.setDate(end.getDate() + calendarDaysCount - 1);
    document.getElementById('dateRange').textContent =
      `${start.toLocaleDateString('en-AU', { day: 'numeric', month: 'short' })} – ${end.toLocaleDateString('en-AU', { day: 'numeric', month: 'short', year: 'numeric' })}`;
    document.querySelectorAll('.container-3 .text-wrapper-3').forEach((label, index) => {
      const date = new Date(start);
      date.setDate(date.getDate() + index);
      label.textContent = date.toLocaleDateString('en-AU', { weekday: 'short' }).toUpperCase();
    });
  }

  function changeCalendarRange(offset) {
    const start = createDateFromKey(calendarStart);
    start.setDate(start.getDate() + offset);
    window.location.href = `/owner-view/owner-view.html?date=${formatDateKey(start)}`;
  }

  function renderCalendar() {
    JobCalendar.render({ start: calendarStart, selected: selectedDate, jobs: allJobs, onSelect(dateKey, entries) {
      if (entries.length > 0) {
        window.location.href = `/owner-view/owner-view.html?date=${dateKey}&start=${calendarStart}`;
        return;
      }
        selectedDate = dateKey;
        window.history.replaceState({}, '', `/owner-view-empty/owner-view-empty.html?date=${dateKey}&start=${calendarStart}`);
        renderCalendar(); renderEmptyDate();
    } });
  }

  function renderStatistics() { /* Rendered together by JobCalendar. */ }

  function renderEmptyDate() {
    document.getElementById(
      'selectedDateTitle'
    ).textContent = formatSelectedDate(selectedDate);

    document.getElementById(
      'selectedJobCount'
    ).textContent = '0 jobs';
  }

  async function loadEmptyCalendar() {
    try {
      const response = await fetch('/api/jobs');
      const jobs = await response.json();

      if (!response.ok) {
        throw new Error(
          jobs.message || 'Unable to load jobs'
        );
      }

      allJobs = jobs;

      const params =
        new URLSearchParams(window.location.search);

      selectedDate =
        params.get('date') || formatDateKey(new Date());
      if (!/^\d{4}-\d{2}-\d{2}$/.test(selectedDate) || Number.isNaN(createDateFromKey(selectedDate).getTime())) {
        selectedDate = formatDateKey(new Date());
      }
      calendarStart = params.get('start') || selectedDate;

      if (getJobsForDate(selectedDate).length > 0) {
        window.location.href =
          `/owner-view/owner-view.html?date=${encodeURIComponent(selectedDate)}&start=${calendarStart}`;
        return;
      }

      renderDateRange();

      renderCalendar();
      renderStatistics();
      renderEmptyDate();

    } catch (error) {
      console.error('Empty calendar error:', error);

      document.getElementById(
        'selectedDateTitle'
      ).textContent = 'Unable to load jobs';
    }
  }

  document.querySelector('.button-2').addEventListener('click', () => changeCalendarRange(-calendarDaysCount));
  document.querySelector('.button-3').addEventListener('click', () => changeCalendarRange(calendarDaysCount));
  loadEmptyCalendar();
</script>
