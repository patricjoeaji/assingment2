<script>
  let currentUser;
  try {
    currentUser = JSON.parse(sessionStorage.getItem('currentUser') || 'null');
  } catch (e) {
    currentUser = null;
  }
  if (!currentUser || currentUser.role !== 'Owner') {
    if (currentUser && currentUser.role === 'Worker') {
      window.location.href = '/worker-view/worker-view.html';
    } else {
      window.location.href = '/login/login.html';
    }
  }

  const calendarStart = '2026-09-01';
  const calendarDaysCount = 14;

  let allJobs = [];
  let selectedDate = null;

  function normaliseStatus(status) {
    return String(status || 'Pending').toLowerCase();
  }

  function formatDateKey(date) {
    const year = date.getFullYear();
    const month =
      String(date.getMonth() + 1).padStart(2, '0');
    const day =
      String(date.getDate()).padStart(2, '0');

    return `${year}-${month}-${day}`;
  }

  function createDateFromKey(dateKey) {
    return new Date(`${dateKey}T00:00:00`);
  }

  function formatSelectedDate(dateKey) {
    return createDateFromKey(dateKey)
      .toLocaleDateString('en-AU', {
        weekday: 'long',
        day: 'numeric',
        month: 'long'
      });
  }

  function getJobsForDate(dateKey) {
    return allJobs.filter(job => job.date === dateKey);
  }

  function getDotClass(status) {
    const normalised = normaliseStatus(status);

    if (normalised === 'accepted') {
      return 'italic-text-2';
    }

    if (normalised === 'declined') {
      return 'italic-text-3';
    }

    return 'italic-text';
  }

  function renderCalendar() {
    const container =
      document.getElementById('calendarDays');

    container.innerHTML = '';

    const startDate =
      createDateFromKey(calendarStart);

    for (
      let index = 0;
      index < calendarDaysCount;
      index += 1
    ) {
      const date = new Date(startDate);
      date.setDate(startDate.getDate() + index);

      const dateKey = formatDateKey(date);
      const jobs = getJobsForDate(dateKey);
      const isSelected = dateKey === selectedDate;

      const button = document.createElement('button');
      button.className = `button-${4 + index}`;
      button.type = 'button';

      const statuses = [
        ...new Set(
          jobs.map(job => normaliseStatus(job.status))
        )
      ];

      const dots = statuses
        .map(status => {
          return `<div class="${getDotClass(status)}"></div>`;
        })
        .join('');

      button.innerHTML = `
        ${isSelected ? '<div class="ellipse"></div>' : ''}

        <div class="div-wrapper-2">
          <div class="${isSelected ? 'text-11' : 'text-8'}">
            <div class="${isSelected ? 'text-wrapper-7' : 'text-wrapper-4'}">
              ${date.getDate()}
            </div>
          </div>
        </div>

        <div class="text-9">
          ${dots}
        </div>
      `;

      button.addEventListener('click', () => {
        if (jobs.length > 0) {
          window.location.href =
            `owner-view.html?date=${encodeURIComponent(dateKey)}`;
          return;
        }

        selectedDate = dateKey;

        window.history.replaceState(
          {},
          '',
          `owner-view-empty.html?date=${encodeURIComponent(dateKey)}`
        );

        renderCalendar();
        renderEmptyDate();
      });

      container.appendChild(button);
    }
  }

  function renderStatistics() {
    const endDate =
      createDateFromKey(calendarStart);

    endDate.setDate(
      endDate.getDate() + calendarDaysCount - 1
    );

    const endKey = formatDateKey(endDate);

    const rangeJobs = allJobs.filter(job => {
      return (
        job.date >= calendarStart &&
        job.date <= endKey
      );
    });

    const pending = rangeJobs.filter(job => {
      return normaliseStatus(job.status) === 'pending';
    }).length;

    const accepted = rangeJobs.filter(job => {
      return normaliseStatus(job.status) === 'accepted';
    }).length;

    const declined = rangeJobs.filter(job => {
      return normaliseStatus(job.status) === 'declined';
    }).length;

    document.getElementById('pendingCount').textContent =
      pending;

    document.getElementById('acceptedCount').textContent =
      accepted;

    document.getElementById('declinedCount').textContent =
      declined;

    document.getElementById('totalCount').textContent =
      rangeJobs.length;
  }

  function renderEmptyDate() {
    document.getElementById(
      'selectedDateTitle'
    ).textContent = formatSelectedDate(selectedDate);

    document.getElementById(
      'selectedJobCount'
    ).textContent = '0 jobs';
  }

  async function loadEmptyCalendar() {
    try {
      const response = await fetch('/api/jobs');
      const jobs = await response.json();

      if (!response.ok) {
        throw new Error(
          jobs.message || 'Unable to load jobs'
        );
      }

      allJobs = jobs;

      const params =
        new URLSearchParams(window.location.search);

      selectedDate =
        params.get('date') || '2026-09-04';

      if (getJobsForDate(selectedDate).length > 0) {
        window.location.href =
          `owner-view.html?date=${encodeURIComponent(selectedDate)}`;
        return;
      }

      document.getElementById('dateRange').textContent =
        '1 Sep – 14 Sep, 2026';

      renderCalendar();
      renderStatistics();
      renderEmptyDate();

    } catch (error) {
      console.error('Empty calendar error:', error);

      document.getElementById(
        'selectedDateTitle'
      ).textContent = 'Unable to load jobs';
    }
  }

  loadEmptyCalendar();
</script>
